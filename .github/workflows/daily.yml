name: daily-ad-report

on:
  schedule:
    - cron: "50 22 * * *"    # 매일 07:50 KST (UTC 22:50). 정각은 GitHub 부하로 지연·누락이 잦아 피함
  workflow_dispatch:          # Actions 탭에서 수동 실행
    inputs:
      date:
        description: "리포트 날짜 (YYYY-MM-DD, 비우면 어제 KST)"
        required: false
      dry_run:
        description: "발송하지 않고 로그에만 출력"
        type: boolean
        default: false

permissions:
  contents: read   # 워크플로 토큰은 읽기 전용

concurrency:
  group: daily-ad-report     # 같은 리포트가 동시에 두 번 돌지 않도록
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      MOCK_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::DATABASE_URL secret이 없습니다 (README 2단계 참고)"; exit 1; fi

      - name: Start mock media API (background)
        run: |
          nohup uvicorn mock_api.app:app --host 127.0.0.1 --port 8000 > mock_api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          cat mock_api.log; exit 1

      - name: Run daily pipeline
        env:
          # 입력값을 스크립트에 직접 끼워 넣지 않고 환경변수로 넘김 (스크립트 인젝션 방지)
          INPUT_DATE: ${{ inputs.date }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "$INPUT_DATE" ]; then
            if ! [[ "$INPUT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::date는 YYYY-MM-DD 형식이어야 합니다"; exit 1
            fi
            ARGS+=(--date "$INPUT_DATE")
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python -m pipeline daily "${ARGS[@]}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            out/
            mock_api.log
          if-no-files-found: ignore
